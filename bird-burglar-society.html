<script type="text/javascript">
    const ga = new GeneticAlgorithm({

        populationSize: 30,

        maxAge: 3,

        createRandomEntity: randomPrism,

        fitnessFunction: prismFitness,

        interactionRound: prismInteraction,

        crossover: prismCrossover,

        mutate: prismMutate

    });

    for (let generation = 0; generation < 20; generation++) {

        ga.step();

        console.log(
            generation,
            ga.population[0].fitness,
            ga.population[0]
        );
    }
</script>
